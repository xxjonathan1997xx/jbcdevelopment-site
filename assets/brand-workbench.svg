<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="JBC Development software workspace">
  <defs>
    <linearGradient id="deep-blue" x1="120" y1="52" x2="620" y2="466" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset=".52" stop-color="#0b5fff"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="246" y1="230" x2="332" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#155eef"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="glass" x1="144" y1="66" x2="640" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="panel-shadow" x="-14%" y="-16%" width="128%" height="132%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#08214c" flood-opacity=".15"/>
    </filter>
    <filter id="small-shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#08214c" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect x="18" y="24" width="724" height="462" rx="32" fill="#ffffff"/>
  <rect x="44" y="50" width="672" height="410" rx="28" fill="url(#glass)" stroke="#d6e5f7"/>
  <path d="M90 394h580" stroke="#dbeafe" stroke-width="2"/>

  <g filter="url(#panel-shadow)">
    <rect x="98" y="84" width="564" height="304" rx="26" fill="#ffffff" stroke="#d6e5f7"/>
    <rect x="124" y="110" width="512" height="38" rx="14" fill="#f6fbff"/>
    <circle cx="148" cy="129" r="5" fill="#071a33"/>
    <circle cx="166" cy="129" r="5" fill="#0b5fff"/>
    <circle cx="184" cy="129" r="5" fill="#7dd3fc"/>
    <rect x="214" y="122" width="182" height="12" rx="6" fill="#dbeafe"/>
    <rect x="508" y="120" width="90" height="16" rx="8" fill="#071a33" opacity=".9"/>

    <g transform="translate(164 168)">
