    <text x="134" y="326" fill="#071a33" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">JBC</text>
    <text x="134" y="354" fill="#0b5fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">DEVELOPMENT</text>

    <g transform="translate(430 174)">
