      <rect x="18" y="14" width="76" height="8" rx="4" fill="#071a33"/>
      <rect x="18" y="28" width="112" height="5" rx="2.5" fill="#9fb3cc"/>

      <rect x="0" y="62" width="170" height="42" rx="12" fill="#f3f8ff" stroke="#d6e5f7"/>
      <rect x="18" y="76" width="90" height="8" rx="4" fill="#0b5fff"/>
      <rect x="18" y="90" width="126" height="5" rx="2.5" fill="#9fb3cc"/>

